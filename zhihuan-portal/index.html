<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智换 Zhihuan - 让闲置价值重生</title>
    <meta name="description" content="AI 驱动的二手交易平台,智能上架、智能议价、智能推荐" />
  </head>
  <body>
    <div id="app"></div>
    
    <script>
      // 智换 - 保护 window.fetch 不被破坏 (作为最后一道防线)
      (function() {
        if (typeof window.__zhOrigFetch === 'undefined') {
          try {
            window.__zhOrigFetch = window.fetch.bind(window)
            window.__zhFetchGuard = true
          } catch (e) { /* fetch already broken */ }
        }
      })()
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
