server:
  port: 9012

spring:
  application:
    name: zhihuan-product
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/zhihuan_product?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: zhihuan
    password: zhihuan
    type: com.alibaba.druid.pool.DruidDataSource
  config:
    import:
      - optional:nacos:application.yml
      - optional:nacos:zhihuan-product.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:127.0.0.1}:8848
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
      config:
        server-addr: ${NACOS_SERVER:127.0.0.1}:8848
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true

kafka:
    bootstrap-servers: ${KAFKA_SERVER:127.0.0.1}:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        compression.type: lz4
        linger.ms: 10
        batch.size: 16384
    consumer:
      enable-auto-commit: true
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

zhihuan:
  redis:
    redisson: true
  kafka:
    product-events-topic: product-events
    ai-audit-events-topic: ai-audit-events
    ai-audit-group: product-ai-audit-group
    order-events-topic: order-events
    order-group: product-order-group

dubbo:
  application:
    name: zhihuan-product
    qos-enable: false
  scan:
    base-packages: com.zhihuan
  protocol:
    name: tri
    port: 20882
  registry:
    address: nacos://${NACOS_SERVER:127.0.0.1}:8848?namespace=${NACOS_NAMESPACE:public}
    # 只做接口级注册：避免应用级(instance)注册把 Dubbo 端口注册成同名 Nacos 服务，
    # 污染 Spring Cloud 服务发现 → 网关 LB 随机命中 Dubbo 端口导致随机 404/500
    register-mode: interface
  consumer:
    check: false
    timeout: 10000

logging:
  level:
    com.zhihuan: debug
  pattern:
    level: "%5p [%X{traceId:-}]"
