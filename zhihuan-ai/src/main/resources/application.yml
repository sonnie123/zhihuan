server:
  port: 9013

spring:
  application:
    name: zhihuan-ai
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:application.yml
      - optional:nacos:zhihuan-ai.yml
  cloud:
    nacos:
      discovery:
        server-addr: {NACOS_SERVER:127.0.0.1}:8848
        namespace: {NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
      config:
        server-addr: {NACOS_SERVER:127.0.0.1}:8848
        namespace: {NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
        file-extension: yaml
        refresh-enabled: true

dubbo:
  application:
    name: zhihuan-ai
    qos-enable: false
  protocol:
    name: tri
    port: 9013
  registry:
    address: nacos://{NACOS_SERVER:127.0.0.1}:8848?namespace={NACOS_NAMESPACE:dev}
  consumer:
    check: false
    timeout: 10000

logging:
  level:
    com.zhihuan: debug
  pattern:
    level: "%5p [%X{traceId:-}]"
