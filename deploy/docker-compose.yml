version: "3.8"

networks:
  zhihuan-network:
    driver: bridge

services:
  # ========== Nacos 3.0.3（注册中心 + 配置中心）==========
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: zhihuan-nacos
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
      - SPRING_DATASOURCE_PLATFORM=mysql
      - MYSQL_SERVICE_HOST=mysql
      - MYSQL_SERVICE_DB_NAME=nacos
      - MYSQL_SERVICE_PORT=3306
      - MYSQL_SERVICE_USER=nacos
      - MYSQL_SERVICE_PASSWORD=nacos
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
      - NACOS_AUTH_IDENTITY_KEY=zhihuan
      - NACOS_AUTH_IDENTITY_VALUE=zhihuan
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    depends_on:
      - mysql
    networks:
      - zhihuan-network
    restart: unless-stopped

  # ========== MySQL 8.0（主数据库）==========
  mysql:
    image: mysql:8.0
    container_name: zhihuan-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_USER=zhihuan
      - MYSQL_PASSWORD=zhihuan123
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max_connections=1000
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d
    networks:
      - zhihuan-network
    restart: unless-stopped

  # ========== Redis 7.4（缓存 / 分布式锁）==========
  redis:
    image: redis:7.4-alpine
    container_name: zhihuan-redis
    command: >
      redis-server
      --port 6379
      --requirepass zhihuan123
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - zhihuan-network
    restart: unless-stopped

  # ========== Kafka 3.9.1（消息队列）==========
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: zhihuan-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - zhihuan-network
    restart: unless-stopped

  # ========== Elasticsearch 8.15（搜索 + 向量检索）==========
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: zhihuan-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - zhihuan-network
    restart: unless-stopped

  # ========== XXL-JOB 调度中心 ==========
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.5.0
    container_name: zhihuan-xxl-job
    environment:
      PARAMS: >
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=zhihuan
        --spring.datasource.password=zhihuan123
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - zhihuan-network
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  es-data:
